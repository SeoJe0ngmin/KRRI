<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="655" viewBox="0 0 1300 655" role="img" aria-label="전체 흐름의 주요 값 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 01</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">전체 흐름의 주요 값 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">현재 구현</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">태그 탐색</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">현재 왼쪽 최대 50도씩, 누적 약 360도 제한. 과거 대화의 60도와 다름</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">일반 전진</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">한 번 최대 0.8m</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">후진</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">현재 rear_space_m=0.5m. 현장 설정이 한 번 후진 상한을 결정</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">계획 회전</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">한 번 최대 15도</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="90" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">눈감고 진입</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">남은 거리 전체를 한 번에 수행. 일반 전진의 0.8m 제한을 그대로 적용하지</text><text x="448" y="494" font-size="21" font-weight="400" fill="#18374D">않음</text><line x1="40" y1="520" x2="1260" y2="520" stroke="#DCE5EB"/><rect x="40" y="520" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="553" font-size="21" font-weight="600" fill="#18374D">전진 바이트</text><text x="448" y="553" font-size="21" font-weight="400" fill="#18374D">67 사용. 97 저속 전진은 목록에 있으나 현재 주행 계획에서는 사용하지 않음</text><line x1="40" y1="579" x2="1260" y2="579" stroke="#DCE5EB"/><line x1="40" y1="605" x2="1260" y2="605" stroke="#DCE5EB"/><text x="40" y="632" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="632" text-anchor="end" font-size="15" fill="#617888">7–12 / 12 항목</text></svg>