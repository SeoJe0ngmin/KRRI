<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="922" viewBox="0 0 1300 922" role="img" aria-label="상태 전환·종료 사유 (1/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 10</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">상태 전환·종료 사유 (1/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상태·상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">PREPARING 정상 정지</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">새 관측의 시간 간격을 누적해 30초 준비</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="90" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">준비 중 짧은 흔들림</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">같은 추적 기준·위치 4mm·방향 0.35도 이내, 중단 3초 이내이면 준비 시간</text><text x="448" y="317" font-size="21" font-weight="400" fill="#18374D">보존 가능</text><line x1="40" y1="343" x2="1260" y2="343" stroke="#DCE5EB"/><rect x="40" y="343" width="1220" height="90" fill="white"/><text x="58" y="376" font-size="21" font-weight="600" fill="#18374D">준비 중 이동·기준 변경·오래된</text><text x="58" y="407" font-size="21" font-weight="600" fill="#18374D">관측</text><text x="448" y="376" font-size="21" font-weight="400" fill="#18374D">준비 시간 초기화</text><line x1="40" y1="433" x2="1260" y2="433" stroke="#DCE5EB"/><rect x="40" y="433" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="466" font-size="21" font-weight="600" fill="#18374D">준비 180초 초과</text><text x="448" y="466" font-size="21" font-weight="400" fill="#18374D">preparation_timeout</text><line x1="40" y1="492" x2="1260" y2="492" stroke="#DCE5EB"/><rect x="40" y="492" width="1220" height="59" fill="white"/><text x="58" y="525" font-size="21" font-weight="600" fill="#18374D">WAIT_ENTER에서 정지 조건 상실</text><text x="448" y="525" font-size="21" font-weight="400" fill="#18374D">PREPARING으로 돌아감</text><line x1="40" y1="551" x2="1260" y2="551" stroke="#DCE5EB"/><rect x="40" y="551" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="584" font-size="21" font-weight="600" fill="#18374D">Enter</text><text x="448" y="584" font-size="21" font-weight="400" fill="#18374D">미션 600초 타이머 시작</text><line x1="40" y1="610" x2="1260" y2="610" stroke="#DCE5EB"/><rect x="40" y="610" width="1220" height="59" fill="white"/><text x="58" y="643" font-size="21" font-weight="600" fill="#18374D">PLAN인데 정지 확인 불가</text><text x="448" y="643" font-size="21" font-weight="400" fill="#18374D">RECOVER</text><line x1="40" y1="669" x2="1260" y2="669" stroke="#DCE5EB"/><rect x="40" y="669" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="702" font-size="21" font-weight="600" fill="#18374D">절대 위치 없음·태그 없음</text><text x="448" y="702" font-size="21" font-weight="400" fill="#18374D">왼쪽 탐색 회전</text><line x1="40" y1="728" x2="1260" y2="728" stroke="#DCE5EB"/><rect x="40" y="728" width="1220" height="59" fill="white"/><text x="58" y="761" font-size="21" font-weight="600" fill="#18374D">태그 보이나 아직 사용 불가</text><text x="448" y="761" font-size="21" font-weight="400" fill="#18374D">정지 태그 합의 대기</text><line x1="40" y1="787" x2="1260" y2="787" stroke="#DCE5EB"/><rect x="40" y="787" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="820" font-size="21" font-weight="600" fill="#18374D">최근 2초 안에 태그 후보를 봄</text><text x="448" y="820" font-size="21" font-weight="400" fill="#18374D">즉시 재회전하지 않고 기다림</text><line x1="40" y1="846" x2="1260" y2="846" stroke="#DCE5EB"/><line x1="40" y1="872" x2="1260" y2="872" stroke="#DCE5EB"/><text x="40" y="899" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="899" text-anchor="end" font-size="15" fill="#617888">1–10 / 29 항목</text></svg>