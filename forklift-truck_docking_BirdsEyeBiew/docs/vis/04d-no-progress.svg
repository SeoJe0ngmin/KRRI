<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1440" viewBox="0 0 2100 1440" role="img" aria-labelledby="title desc">
<title id="title">이동 진행 정체</title>
<desc id="desc">중앙의 주 흐름에서 조건에 따라 좌우로 분기한다. 복귀선은 직각 경로로 표시한다.</desc>
