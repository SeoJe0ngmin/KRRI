<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="714" viewBox="0 0 1300 714" role="img" aria-label="센서·시간 검사 (3/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 12</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">센서·시간 검사 (3/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="412" y="174" font-size="21" font-weight="600" fill="white">조건·시간</text><text x="888" y="174" font-size="21" font-weight="600" fill="white">결과</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">동일 스테레오 반복</text><text x="412" y="227" font-size="21" font-weight="400" fill="#18374D">완전히 동일 프레임</text><text x="888" y="227" font-size="21" font-weight="400" fill="#18374D">건너뜀</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">프레임 번호 감소·시각 증가</text><text x="412" y="286" font-size="21" font-weight="400" fill="#18374D">번호 이상</text><text x="888" y="286" font-size="21" font-weight="400" fill="#18374D">기록 후 계속</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">새 프레임 시각 감소·정지</text><text x="412" y="345" font-size="21" font-weight="400" fill="#18374D">연속성 실패</text><text x="888" y="345" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">장치 시계 wrap</text><text x="412" y="404" font-size="21" font-weight="400" fill="#18374D">약 71.6분, wrap으로 인식</text><text x="888" y="404" font-size="21" font-weight="400" fill="#18374D">연속 시간 보정</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">오래된 네이티브 영상 입력</text><text x="412" y="463" font-size="21" font-weight="400" fill="#18374D">큐 대기 0.3초 초과</text><text x="888" y="463" font-size="21" font-weight="400" fill="#18374D">해당 영상 버림</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">일반 measure의 지정 IMU 오류</text><text x="412" y="522" font-size="21" font-weight="400" fill="#18374D">sample_gap·보간 공백·unbracketed_imu</text><text x="888" y="522" font-size="21" font-weight="400" fill="#18374D">최대 3회 재시작</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="90" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">실주행·shadow·자동 직진</text><text x="58" y="612" font-size="21" font-weight="600" fill="#18374D">보정</text><text x="412" y="581" font-size="21" font-weight="400" fill="#18374D">같은 오류</text><text x="888" y="581" font-size="21" font-weight="400" fill="#18374D">자동 재실행 안 함</text><line x1="40" y1="638" x2="1260" y2="638" stroke="#DCE5EB"/><line x1="40" y1="664" x2="1260" y2="664" stroke="#DCE5EB"/><text x="40" y="691" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="691" text-anchor="end" font-size="15" fill="#617888">17–23 / 23 항목</text></svg>