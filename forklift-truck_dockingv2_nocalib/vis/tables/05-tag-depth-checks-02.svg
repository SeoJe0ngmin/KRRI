<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="801" viewBox="0 0 1300 801" role="img" aria-label="태그·Depth·시각 검사 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 05</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">태그·Depth·시각 검사 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">검사</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">기준 / 실패 시 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">Depth 범위</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">0.3m 초과~8m 미만</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">Depth 표본</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">유효 비율 50% 이상, 최소 12개</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">Depth 표면 혼합</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">90백분위−10백분위 ≤ 0.1m</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">Depth와 PnP 차이</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">0.3m 이하</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">Depth 없음·부족·혼합 표면</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">Depth 검사 생략. 태그를 무조건 버리지 않음</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">태그 촬영 시각의 이력 없음</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">capture_outside_history 등으로 융합 거부</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">이력 기준계 다름</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">history_epoch_unavailable</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">보간할 VIO 두 상태 간격</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">0.15초 초과이면 history_gap</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><rect x="40" y="666" width="1220" height="59" fill="white"/><text x="58" y="699" font-size="21" font-weight="600" fill="#18374D">이력 보관</text><text x="448" y="699" font-size="21" font-weight="400" fill="#18374D">최대 5초 / 300개</text><line x1="40" y1="725" x2="1260" y2="725" stroke="#DCE5EB"/><line x1="40" y1="751" x2="1260" y2="751" stroke="#DCE5EB"/><text x="40" y="778" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="778" text-anchor="end" font-size="15" fill="#617888">11–19 / 19 항목</text></svg>