<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="742" viewBox="0 0 1300 742" role="img" aria-label="장착 보정 규칙 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 15</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">장착 보정 규칙 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">저장·진행 판단</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">시작·끝 VIO 기준 변경</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">가능한 경우 태그 회전으로 방향 변화 보완</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">센서 시간 기준 변경</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">연결 불가 → 저장 거부</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">이동거리</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">5cm 이상, 끝점 흩어짐 합의 2배보다 커야 함</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">큰 회전·흩어짐·기울기·방향 σ</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">다수 품질 조건은 경고만 기록 후 저장</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">계산 불가·절차 미완료</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">저장 안 함</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">측정 중 common 변경</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">덮어쓰기 거부</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">전체 제한 시간</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">90~300초, 기본 180초</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">복귀</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">자동 후진 없음. 수동 복귀</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><line x1="40" y1="692" x2="1260" y2="692" stroke="#DCE5EB"/><text x="40" y="719" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="719" text-anchor="end" font-size="15" fill="#617888">9–16 / 16 항목</text></svg>