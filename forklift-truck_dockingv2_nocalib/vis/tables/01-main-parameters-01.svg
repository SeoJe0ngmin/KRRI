<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="655" viewBox="0 0 1300 655" role="img" aria-label="전체 흐름의 주요 값 (1/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 01</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">전체 흐름의 주요 값 (1/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">현재 구현</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">중앙 모드 목표</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">포크 앞끝이 입구면 0.5m 전</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">좌측 모드 목표</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">포크 앞끝이 입구면을 지나 1m</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">계획 깊이</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">최대 6단계. 반드시 6개 생성 또는 6번 안에 도착하는 뜻은 아님</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">실행 범위</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">계획 중 첫 번째 회전·이동 묶음</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">재계획</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">이동 후 정지하면 오차 크기와 관계없이 다시 계획</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="90" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">회전 직후</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">정지 후 같은 묶음의 원래 직진을 이어 갈 수 있음. 매 회전 직후 무조건</text><text x="448" y="553" font-size="21" font-weight="400" fill="#18374D">6단계 재계획하지 않음</text><line x1="40" y1="579" x2="1260" y2="579" stroke="#DCE5EB"/><line x1="40" y1="605" x2="1260" y2="605" stroke="#DCE5EB"/><text x="40" y="632" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="632" text-anchor="end" font-size="15" fill="#617888">1–6 / 12 항목</text></svg>