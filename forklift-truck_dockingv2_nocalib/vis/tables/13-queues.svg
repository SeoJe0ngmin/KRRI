<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="624" viewBox="0 0 1300 624" role="img" aria-label="큐가 밀리는 경우"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 13</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">큐가 밀리는 경우</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">데이터</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">영상·태그 작업·미리보기</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">최신 항목으로 이전 항목 교체</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">IMU</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">순서 보존, 넘치면 오류</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">ROS 상태 버퍼</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">최대 32개, 넘치면 오래된 상태 제거·누락 횟수 증가</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">태그 대기 버퍼</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">최대 32개, 오래된 태그 제거</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">제어 관측·계획 요청</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">크기 1 큐 중심, 최신 상태 사용</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">로그 큐</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">최대 4,096개, 넘치면 로그 누락 카운트 증가</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><line x1="40" y1="574" x2="1260" y2="574" stroke="#DCE5EB"/><text x="40" y="601" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="601" text-anchor="end" font-size="15" fill="#617888">1–6 / 6 항목</text></svg>