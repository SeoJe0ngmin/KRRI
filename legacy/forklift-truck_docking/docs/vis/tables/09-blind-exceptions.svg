<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="773" viewBox="0 0 1300 773" role="img" aria-label="눈감고 진입의 예외"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 09</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">눈감고 진입의 예외</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">VIO 정상</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">실제 상대 진행량으로 종료 시점 판단</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">VIO 지연·추적 기준 변경</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">시간 기반 종료로 전환</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">VIO 다시 회복</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">해당 동작에서는 시간 기반 유지</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">시간 기반 목표</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">출발 지연 + 전체 목표거리 / 추정속도</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">시간 기준 시작점</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">추적을 잃은 순간이 아니라 원래 전진 시작 시점</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">종료 후 정지 확신 없음</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">중립 후 2초가 지나면 완료 처리 가능</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">종료 후 좌우·앞뒤 오차</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">기록하지만 이 경로에서는 합격 여부 재검사 안 함</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="90" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">IMU 오래됨·센서 작업자</text><text x="58" y="671" font-size="21" font-weight="600" fill="#18374D">종료·CAN deadman</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">상위 감시가 별도로 정지시킬 수 있음</text><line x1="40" y1="697" x2="1260" y2="697" stroke="#DCE5EB"/><line x1="40" y1="723" x2="1260" y2="723" stroke="#DCE5EB"/><text x="40" y="750" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="750" text-anchor="end" font-size="15" fill="#617888">1–8 / 8 항목</text></svg>