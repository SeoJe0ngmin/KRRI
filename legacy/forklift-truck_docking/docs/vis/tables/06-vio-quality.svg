<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="919" viewBox="0 0 1300 919" role="img" aria-label="VIO 품질·유효기간"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 06</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">VIO 품질·유효기간</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">기준</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">영상·상태 시각 차이</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">10⁻⁵초 미만</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">연속성</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">같은 epoch, delta_valid, 이전 시각 연결, 상태 간격 0.4초 이하</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">특징점</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">현재와 이전부터 이어진 특징점 각각 최소 20개</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">이번 출력 보정 판단</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">ZUPT 또는 MSCKF+SLAM 보정 특징점 합계 3개 이상</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">마지막 보정 이후</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">최대 1초</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">VIO 품질 검사 전달 지연</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">최대 1초</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">정지 상태 제어 판단</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">관측 나이·전달 지연 각각 최대 0.3초</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">이동 상태 제어 판단</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">관측 나이·전달 지연 각각 최대 1초</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><rect x="40" y="666" width="1220" height="59" fill="white"/><text x="58" y="699" font-size="21" font-weight="600" fill="#18374D">IMU 나이</text><text x="448" y="699" font-size="21" font-weight="400" fill="#18374D">최대 1초</text><line x1="40" y1="725" x2="1260" y2="725" stroke="#DCE5EB"/><rect x="40" y="725" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="758" font-size="21" font-weight="600" fill="#18374D">태그 상태 표시</text><text x="448" y="758" font-size="21" font-weight="400" fill="#18374D">유효기간 0.7초</text><line x1="40" y1="784" x2="1260" y2="784" stroke="#DCE5EB"/><rect x="40" y="784" width="1220" height="59" fill="white"/><text x="58" y="817" font-size="21" font-weight="600" fill="#18374D">앵커 이후 위치 사용 한계</text><text x="448" y="817" font-size="21" font-weight="400" fill="#18374D">60초 / 누적 상대 이동 5m</text><line x1="40" y1="843" x2="1260" y2="843" stroke="#DCE5EB"/><line x1="40" y1="869" x2="1260" y2="869" stroke="#DCE5EB"/><text x="40" y="896" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="896" text-anchor="end" font-size="15" fill="#617888">1–11 / 11 항목</text></svg>