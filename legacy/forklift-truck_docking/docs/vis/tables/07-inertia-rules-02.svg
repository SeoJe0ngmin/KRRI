<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="624" viewBox="0 0 1300 624" role="img" aria-label="관성 보정·학습 규칙 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 07</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">관성 보정·학습 규칙 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">실제 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">반응 학습</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">정지 확인 및 같은 추적 기준 유지 시</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">학습 비율</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">기존 추정 50% + 새 관측 50%</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">속도 학습 조건</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">동작 0.2초 초과, 진행량 양수, 유한값, 속도 0.002~1 범위</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">관성시간</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">추가 이동량÷속도, 0~2초 제한</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">출발 지연</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">명령부터 이동 시작까지, 0~5초 범위</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">저장 기간·용도</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">이번 run 내 추정. 센서 위치를 직접 바꾸지 않음</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><line x1="40" y1="574" x2="1260" y2="574" stroke="#DCE5EB"/><text x="40" y="601" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="601" text-anchor="end" font-size="15" fill="#617888">8–13 / 13 항목</text></svg>