<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="627" viewBox="0 0 1300 627" role="img" aria-label="2.90m·2.40m 예시"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 04</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">2.90m·2.40m 예시</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">예시</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">실제 규칙</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">2.90m → 차이 10cm</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">후보 절반 이상이 해당 범위이면 수용</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">2.40m → 차이 60cm, 0.5초 시점</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">건너뜀</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="90" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">마지막 수용 후 1초 경과, 여전히</text><text x="58" y="376" font-size="21" font-weight="600" fill="#18374D">60cm 차이</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">현재 구현은 수용할 수 있음</text><line x1="40" y1="402" x2="1260" y2="402" stroke="#DCE5EB"/><rect x="40" y="402" width="1220" height="90" fill="#F3F7FA"/><text x="58" y="435" font-size="21" font-weight="600" fill="#18374D">2.40 → 2.10 → 2.60처럼 창마다</text><text x="58" y="466" font-size="21" font-weight="600" fill="#18374D">달라짐</text><text x="448" y="435" font-size="21" font-weight="400" fill="#18374D">창 사이 일관성 검사 없음. 1초 이후 수용 가능</text><line x1="40" y1="492" x2="1260" y2="492" stroke="#DCE5EB"/><rect x="40" y="492" width="1220" height="59" fill="white"/><text x="58" y="525" font-size="21" font-weight="600" fill="#18374D">태그를 한참 못 보다가 재검출</text><text x="448" y="525" font-size="21" font-weight="400" fill="#18374D">이미 마지막 수용 후 1초가 지났다면 불일치 창도 즉시 수용 가능</text><line x1="40" y1="551" x2="1260" y2="551" stroke="#DCE5EB"/><line x1="40" y1="577" x2="1260" y2="577" stroke="#DCE5EB"/><text x="40" y="604" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="604" text-anchor="end" font-size="15" fill="#617888">1–5 / 5 항목</text></svg>