<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-label="상태 전환·종료 사유 (2/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 10</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">상태 전환·종료 사유 (2/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상태·상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">탐색 중 유용한 태그 후보 발견</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">중립 → 정지 → 다시 판단</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">탐색 시간·각도 소진</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">search_exhausted / search_360_exhausted</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">탐색 중 VIO 상실</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">search_tracking_lost_unmeasured_angle</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">계획 중 관측 상실</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">RECOVER</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">계획 결과 도착 시 위치 변경</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">위치 1cm·방향 0.5도 초과 또는 epoch 변경이면 재계획</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">이전 계획 ID 응답</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">무시</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">계획기 예외</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">planner 오류 종료</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">개선 후보 없음</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">no_feasible_progress</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><rect x="40" y="666" width="1220" height="59" fill="white"/><text x="58" y="699" font-size="21" font-weight="600" fill="#18374D">일반 이동 중 추적 상실</text><text x="448" y="699" font-size="21" font-weight="400" fill="#18374D">중립 → RECOVER</text><line x1="40" y1="725" x2="1260" y2="725" stroke="#DCE5EB"/><rect x="40" y="725" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="758" font-size="21" font-weight="600" fill="#18374D">일반 이동 중 절대 위치 무효</text><text x="448" y="758" font-size="21" font-weight="400" fill="#18374D">pose_untrusted → 회복 대기</text><line x1="40" y1="784" x2="1260" y2="784" stroke="#DCE5EB"/><line x1="40" y1="810" x2="1260" y2="810" stroke="#DCE5EB"/><text x="40" y="837" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="837" text-anchor="end" font-size="15" fill="#617888">11–20 / 29 항목</text></svg>