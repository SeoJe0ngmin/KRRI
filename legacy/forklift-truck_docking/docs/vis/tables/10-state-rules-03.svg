<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="801" viewBox="0 0 1300 801" role="img" aria-label="상태 전환·종료 사유 (3/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 10</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">상태 전환·종료 사유 (3/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상태·상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">탑재부 차체 공간 위반</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">bay_side_clearance</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">정지 후 20초 동안 불안정</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">RECOVER로 이동</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">위 회복의 시간 기준</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">정지 명령 시점부터 60초. 20+60=80초가 아님</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">회복 중 정지·위치 확보</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">PLAN</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">회복 시간 초과</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">recovery_timeout</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">일반 목표보다 5cm 넘게 지나침</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">target_overshoot</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">일반 목표 앞뒤 ±5cm·좌우 통과</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">COMPLETE</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">앞뒤 도착·좌우 실패</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">target_reached_with_lateral_error</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><rect x="40" y="666" width="1220" height="59" fill="white"/><text x="58" y="699" font-size="21" font-weight="600" fill="#18374D">FAULT·COMPLETE</text><text x="448" y="699" font-size="21" font-weight="400" fill="#18374D">정지 명령 상태로 종료</text><line x1="40" y1="725" x2="1260" y2="725" stroke="#DCE5EB"/><line x1="40" y1="751" x2="1260" y2="751" stroke="#DCE5EB"/><text x="40" y="778" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="778" text-anchor="end" font-size="15" fill="#617888">21–29 / 29 항목</text></svg>