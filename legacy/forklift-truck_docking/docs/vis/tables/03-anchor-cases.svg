<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="745" viewBox="0 0 1300 745" role="img" aria-label="앵커 갱신 케이스"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 03</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">앵커 갱신 케이스</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">현재 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">태그 창에 1~2개</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">최소 3개까지 대기</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">첫 유효 창</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">방향 offset과 위치 앵커 초기화</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">후보 절반 이상이 기존 앵커와 일치</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">일치 후보들만 모아 중앙값으로 갱신</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="90" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">일치 후보 절반 미만 + 마지막</text><text x="58" y="435" font-size="21" font-weight="600" fill="#18374D">수용 후 1초 미만</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">위치 앵커 갱신 건너뜀</text><line x1="40" y1="461" x2="1260" y2="461" stroke="#DCE5EB"/><rect x="40" y="461" width="1220" height="90" fill="white"/><text x="58" y="494" font-size="21" font-weight="600" fill="#18374D">일치 후보 절반 미만 + 마지막</text><text x="58" y="525" font-size="21" font-weight="600" fill="#18374D">수용 후 1초 이상</text><text x="448" y="494" font-size="21" font-weight="400" fill="#18374D">불일치 후보들의 중앙값 수용</text><line x1="40" y1="551" x2="1260" y2="551" stroke="#DCE5EB"/><rect x="40" y="551" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="584" font-size="21" font-weight="600" fill="#18374D">태그 없음·앞단 검사 탈락</text><text x="448" y="584" font-size="21" font-weight="400" fill="#18374D">앵커 유지, VIO로 이어 감</text><line x1="40" y1="610" x2="1260" y2="610" stroke="#DCE5EB"/><rect x="40" y="610" width="1220" height="59" fill="white"/><text x="58" y="643" font-size="21" font-weight="600" fill="#18374D">추적 기준 재설정</text><text x="448" y="643" font-size="21" font-weight="400" fill="#18374D">앵커·offset·태그 창 초기화</text><line x1="40" y1="669" x2="1260" y2="669" stroke="#DCE5EB"/><line x1="40" y1="695" x2="1260" y2="695" stroke="#DCE5EB"/><text x="40" y="722" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="722" text-anchor="end" font-size="15" fill="#617888">1–7 / 7 항목</text></svg>