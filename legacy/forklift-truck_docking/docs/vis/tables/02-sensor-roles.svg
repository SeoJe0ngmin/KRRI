<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="624" viewBox="0 0 1300 624" role="img" aria-label="센서와 추정값의 역할"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 02</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">센서와 추정값의 역할</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">입력</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">실제 역할</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">컬러 태그</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">탑재부 기준 위치를 다시 잡는 주된 기준</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">PnP 방향</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">최초 방향 기준 설정 + 정차 시 약한 방향 보정</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">IR 스테레오 + IMU</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">OpenVINS에서 상대 이동·회전을 계속 추적</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">Depth</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">태그 거리 일관성 검사. 별도의 위치 측정으로 중복 융합하지 않음</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">차량 반응 추정값</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">후보 소요시간·예측 정지에 사용</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">σ·공분산</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">불확실성 계산·기록. 현재 좌우 진입 기준에는 σ를 더하지 않음</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><line x1="40" y1="574" x2="1260" y2="574" stroke="#DCE5EB"/><text x="40" y="601" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="601" text-anchor="end" font-size="15" fill="#617888">1–6 / 6 항목</text></svg>