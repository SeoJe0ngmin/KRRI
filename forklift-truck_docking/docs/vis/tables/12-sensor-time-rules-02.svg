<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="742" viewBox="0 0 1300 742" role="img" aria-label="센서·시간 검사 (2/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 12</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">센서·시간 검사 (2/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="412" y="174" font-size="21" font-weight="600" fill="white">조건·시간</text><text x="888" y="174" font-size="21" font-weight="600" fill="white">결과</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">Depth·컬러 시각 차이</text><text x="412" y="227" font-size="21" font-weight="400" fill="#18374D">25ms 초과</text><text x="888" y="227" font-size="21" font-weight="400" fill="#18374D">Depth 검사 생략</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">IMU 정상 간격</text><text x="412" y="286" font-size="21" font-weight="400" fill="#18374D">50ms 이하</text><text x="888" y="286" font-size="21" font-weight="400" fill="#18374D">정상</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">고립된 짧은 공백</text><text x="412" y="345" font-size="21" font-weight="400" fill="#18374D">50~100ms, 직전 짧은 공백과 1초 초과 간격</text><text x="888" y="345" font-size="21" font-weight="400" fill="#18374D">허용</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">짧은 공백 분산 추가</text><text x="412" y="404" font-size="21" font-weight="400" fill="#18374D">위치 각 축 (0.03m)²·방향 (2도)²</text><text x="888" y="404" font-size="21" font-weight="400" fill="#18374D">기록용 분산 증가</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">반복 공백·100ms 초과</text><text x="412" y="463" font-size="21" font-weight="400" fill="#18374D">운용 중</text><text x="888" y="463" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">IMU 시각 역전·중복</text><text x="412" y="522" font-size="21" font-weight="400" fill="#18374D">운용 중</text><text x="888" y="522" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">IMU 큐</text><text x="412" y="581" font-size="21" font-weight="400" fill="#18374D">4,096개 초과</text><text x="888" y="581" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">가속도 보간 불가</text><text x="412" y="640" font-size="21" font-weight="400" fill="#18374D">양쪽 표본 없음·간격 초과</text><text x="888" y="640" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><line x1="40" y1="692" x2="1260" y2="692" stroke="#DCE5EB"/><text x="40" y="719" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="719" text-anchor="end" font-size="15" fill="#617888">9–16 / 23 항목</text></svg>