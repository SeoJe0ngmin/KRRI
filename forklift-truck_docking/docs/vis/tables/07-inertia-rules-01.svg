<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="683" viewBox="0 0 1300 683" role="img" aria-label="관성 보정·학습 규칙 (1/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 07</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">관성 보정·학습 규칙 (1/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">실제 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">직진 진행량</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">시작 방향으로 투영한 VIO 변위</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">회전 진행량</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">VIO 방향 변화, 좌·우 명령에 따라 부호 처리</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">실제 이동 시작</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">진행량 &gt; 0.005. 직진 m, 회전 rad</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">속도 필터</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">이전 속도 65% + 새 관측 속도 35%</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">정지 여유</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">max(속도, 0) × (추정 관성시간 + 관측 나이)</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">목표 전 정지</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">실제 이동을 확인한 뒤에만 적용</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">반대 방향 이동</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">직진 −3cm 미만 또는 회전 −2도 미만이면 오류</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><line x1="40" y1="633" x2="1260" y2="633" stroke="#DCE5EB"/><text x="40" y="660" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="660" text-anchor="end" font-size="15" fill="#617888">1–7 / 13 항목</text></svg>