<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="742" viewBox="0 0 1300 742" role="img" aria-label="센서·시간 검사 (1/3)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 12</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">센서·시간 검사 (1/3)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">항목</text><text x="412" y="174" font-size="21" font-weight="600" fill="white">조건·시간</text><text x="888" y="174" font-size="21" font-weight="600" fill="white">결과</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">영상 첫 수신</text><text x="412" y="227" font-size="21" font-weight="400" fill="#18374D">완전한 IR 좌·우+컬러 30초 내</text><text x="888" y="227" font-size="21" font-weight="400" fill="#18374D">초과 오류</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">영상 운용 중</text><text x="412" y="286" font-size="21" font-weight="400" fill="#18374D">새 완전 프레임 2초 없음</text><text x="888" y="286" font-size="21" font-weight="400" fill="#18374D">오류</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">IMU 초기 안정화</text><text x="412" y="345" font-size="21" font-weight="400" fill="#18374D">장치·도착 시간 모두 연속 0.5초</text><text x="888" y="345" font-size="21" font-weight="400" fill="#18374D">준비까지 VIO 영상 입력 보류</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220"