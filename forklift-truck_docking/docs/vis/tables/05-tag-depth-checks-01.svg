<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-label="태그·Depth·시각 검사 (1/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 05</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">태그·Depth·시각 검사 (1/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">검사</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">기준 / 실패 시 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">태그 종류·ID</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">tag36h11, 현재 ID 1</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">검출 margin</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">20 이상</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">Hamming</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">0 이하: 오류 비트 수정 없는 검출</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">일치 태그 개수</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">정확히 1개. 없거나 중복이면 탈락</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">화면 경계</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">최소 여백 15px</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">태그 크기</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">네 변 중 최소 길이 20px</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">PnP 깊이</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">꼭짓점 모두 카메라 앞쪽</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">재투영 오차</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">2px 이하</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><rect x="40" y="666" width="1220" height="59" fill="white"/><text x="58" y="699" font-size="21" font-weight="600" fill="#18374D">두 해 모호성</text><text x="448" y="699" font-size="21" font-weight="400" fill="#18374D">최선/차선 오차 비율 0.8 이하</text><line x1="40" y1="725" x2="1260" y2="725" stroke="#DCE5EB"/><rect x="40" y="725" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="758" font-size="21" font-weight="600" fill="#18374D">PnP 수치 조건</text><text x="448" y="758" font-size="21" font-weight="400" fill="#18374D">유한한 정보행렬, 조건수 10¹² 이하</text><line x1="40" y1="784" x2="1260" y2="784" stroke="#DCE5EB"/><line x1="40" y1="810" x2="1260" y2="810" stroke="#DCE5EB"/><text x="40" y="837" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="837" text-anchor="end" font-size="15" fill="#617888">1–10 / 19 항목</text></svg>