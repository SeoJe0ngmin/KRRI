<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="742" viewBox="0 0 1300 742" role="img" aria-label="환경·작업자·기록 예외 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 16</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">환경·작업자·기록 예외 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">상황</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">계획기 프로세스 종료</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">전체 종료</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">관측 시각이 이전 이하</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">nonmonotonic observation</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="59" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">제어 로그 기록 실패</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">한 번 경고 후 계속</text><line x1="40" y1="371" x2="1260" y2="371" stroke="#DCE5EB"/><rect x="40" y="371" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="404" font-size="21" font-weight="600" fill="#18374D">카메라 관측 로그 기록 실패</text><text x="448" y="404" font-size="21" font-weight="400" fill="#18374D">카메라 작업자가 예외 → 전체 종료 가능</text><line x1="40" y1="430" x2="1260" y2="430" stroke="#DCE5EB"/><rect x="40" y="430" width="1220" height="59" fill="white"/><text x="58" y="463" font-size="21" font-weight="600" fill="#18374D">로그 용량</text><text x="448" y="463" font-size="21" font-weight="400" fill="#18374D">기록기별 500MiB 제한</text><line x1="40" y1="489" x2="1260" y2="489" stroke="#DCE5EB"/><rect x="40" y="489" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="522" font-size="21" font-weight="600" fill="#18374D">--seconds 도달</text><text x="448" y="522" font-size="21" font-weight="400" fill="#18374D">지정 시간 종료</text><line x1="40" y1="548" x2="1260" y2="548" stroke="#DCE5EB"/><rect x="40" y="548" width="1220" height="59" fill="white"/><text x="58" y="581" font-size="21" font-weight="600" fill="#18374D">mapped 중 RTAB-Map 종료</text><text x="448" y="581" font-size="21" font-weight="400" fill="#18374D">오류 경로 종료</text><line x1="40" y1="607" x2="1260" y2="607" stroke="#DCE5EB"/><rect x="40" y="607" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="640" font-size="21" font-weight="600" fill="#18374D">RTAB-Map 루프 폐쇄 후보</text><text x="448" y="640" font-size="21" font-weight="400" fill="#18374D">기록만 함. 제어 위치 보정에 사용하지 않음</text><line x1="40" y1="666" x2="1260" y2="666" stroke="#DCE5EB"/><line x1="40" y1="692" x2="1260" y2="692" stroke="#DCE5EB"/><text x="40" y="719" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="719" text-anchor="end" font-size="15" fill="#617888">10–17 / 17 항목</text></svg>