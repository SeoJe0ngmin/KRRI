<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="745" viewBox="0 0 1300 745" role="img" aria-label="CAN 보호·종료 조건 (2/2)"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect x="40" y="38" width="5" height="65" rx="2" fill="#087E8B"/><text x="63" y="54" font-size="15" font-weight="600" fill="#537487">FORKLIFT DOCKING · RULE TABLE 14</text><text x="63" y="94" font-size="31" font-weight="700" fill="#16394F">CAN 보호·종료 조건 (2/2)</text><rect x="40" y="139" width="1220" height="55" fill="#173C52"/><text x="58" y="174" font-size="21" font-weight="600" fill="white">조건</text><text x="448" y="174" font-size="21" font-weight="600" fill="white">현재 처리</text><rect x="40" y="194" width="1220" height="59" fill="white"/><text x="58" y="227" font-size="21" font-weight="600" fill="#18374D">공유 잠금 충돌</text><text x="448" y="227" font-size="21" font-weight="400" fill="#18374D">최대 1초 대기. 실패 시 기존 lease 연장 안 함</text><line x1="40" y1="253" x2="1260" y2="253" stroke="#DCE5EB"/><rect x="40" y="253" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="286" font-size="21" font-weight="600" fill="#18374D">이동 중 stop 전달 실패</text><text x="448" y="286" font-size="21" font-weight="400" fill="#18374D">abort 잠금</text><line x1="40" y1="312" x2="1260" y2="312" stroke="#DCE5EB"/><rect x="40" y="312" width="1220" height="90" fill="white"/><text x="58" y="345" font-size="21" font-weight="600" fill="#18374D">이미 stop인데 반복 stop 전달</text><text x="58" y="376" font-size="21" font-weight="600" fill="#18374D">실패</text><text x="448" y="345" font-size="21" font-weight="400" fill="#18374D">이것만으로 새 abort를 걸지 않음</text><line x1="40" y1="402" x2="1260" y2="402" stroke="#DCE5EB"/><rect x="40" y="402" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="435" font-size="21" font-weight="600" fill="#18374D">부모 프로세스 종료</text><text x="448" y="435" font-size="21" font-weight="400" fill="#18374D">중립 전송·종료 절차</text><line x1="40" y1="461" x2="1260" y2="461" stroke="#DCE5EB"/><rect x="40" y="461" width="1220" height="90" fill="white"/><text x="58" y="494" font-size="21" font-weight="600" fill="#18374D">Ctrl+C / s·q·stop+Enter /</text><text x="58" y="525" font-size="21" font-weight="600" fill="#18374D">SSH EOF</text><text x="448" y="494" font-size="21" font-weight="400" fill="#18374D">종료·CAN 정지 절차</text><line x1="40" y1="551" x2="1260" y2="551" stroke="#DCE5EB"/><rect x="40" y="551" width="1220" height="59" fill="#F3F7FA"/><text x="58" y="584" font-size="21" font-weight="600" fill="#18374D">CAN 초기화 응답</text><text x="448" y="584" font-size="21" font-weight="400" fill="#18374D">최대 5초 대기</text><line x1="40" y1="610" x2="1260" y2="610" stroke="#DCE5EB"/><rect x="40" y="610" width="1220" height="59" fill="white"/><text x="58" y="643" font-size="21" font-weight="600" fill="#18374D">정상 펄스 종료 시각</text><text x="448" y="643" font-size="21" font-weight="400" fill="#18374D">중립 전환, 정상 종료 자체는 abort로 잠그지 않음</text><line x1="40" y1="669" x2="1260" y2="669" stroke="#DCE5EB"/><line x1="40" y1="695" x2="1260" y2="695" stroke="#DCE5EB"/><text x="40" y="722" font-size="15" fill="#617888">2026-10-19 코드 기준 · 젯슨의 현장 설정은 다를 수 있음</text><text x="1260" y="722" text-anchor="end" font-size="15" fill="#617888">8–14 / 14 항목</text></svg>